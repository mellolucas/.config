name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v5
      - name: Install test tools
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            echo "$HOMEBREW_PREFIX/bin" >> "$GITHUB_PATH"
          fi
          brew install zsh neovim shellcheck fzf eza ripgrep biome tmux glow
      - name: Install the locked Neovim plugins
        run: |
          XDG_CONFIG_HOME="$PWD" nvim --headless -l /dev/stdin <<'EOF'
          vim.pack.add({}, { confirm = false })
          vim.pack.get({ "nvim-tree.lua", "mini.icons" }, { info = false })
          EOF
      - name: Run isolated checks
        run: sh .tests/run
