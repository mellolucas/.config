# Panes where Ghostty is absent (GitHub Codespaces, WSL, SSH, other
# terminals): the Option chords and browse mode of ghostty/vim.ghostty. No
# prefix key, so nothing collides with Ctrl+B paging, Cmd+Left (Ctrl+A), or
# OpenCode's Ctrl+Space; Option+b then : reaches every other tmux command.
set -g prefix None
unbind C-b

# Neovim and zsh vi mode: no Esc delay, focus events, truecolor
set -s escape-time 10
set -g focus-events on
set -g default-terminal tmux-256color
set -as terminal-features ',xterm*:RGB'

set -g mouse on
set -g mode-keys vi
set -g history-limit 50000

# Terminal palette colors, so tmux follows Catppuccin Mocha and Latte
set -g status-style default
set -g pane-active-border-style fg=blue
set -g mode-style reverse
set -g message-style reverse

# At an edge, Option+h/j/k/l reaches the program (Neovim moves between its
# windows), as Ghostty's performable binds do.
bind -n M-h if -F '#{pane_at_left}' 'send-keys M-h' 'select-pane -L'
bind -n M-j if -F '#{pane_at_bottom}' 'send-keys M-j' 'select-pane -D'
bind -n M-k if -F '#{pane_at_top}' 'send-keys M-k' 'select-pane -U'
bind -n M-l if -F '#{pane_at_right}' 'send-keys M-l' 'select-pane -R'
bind -n M-s split-window -v -c '#{pane_current_path}'
bind -n M-v split-window -h -c '#{pane_current_path}'
# A cell per press, about Ghostty's 10-pixel step
bind -n M-H resize-pane -L 1
bind -n M-J resize-pane -D 1
bind -n M-K resize-pane -U 1
bind -n M-L resize-pane -R 1
bind -n M-= select-layout -E
bind -n M-z resize-pane -Z
# As in Ghostty, closing asks only while something besides the shell runs
bind -n M-w if -F '#{==:#{pane_current_command},zsh}' kill-pane "confirm-before -p 'Close pane? (y/n)' kill-pane"

# Browse mode is copy mode with the keys of Ghostty's browse table. It belongs
# to the pane, so moving and splitting wait until it ends. Ghostty keeps
# Option+b for its own browse mode and sends Option+Left as the same ESC b, so
# from Ghostty (named by its XTVERSION reply) that is a word jump.
bind -n M-b if -F '#{m/i:ghostty*,#{client_termtype}}' 'send-keys M-b' copy-mode
bind -T copy-mode-vi y send -X copy-selection-no-clear
bind -T copy-mode-vi : command-prompt
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi i send -X cancel
bind -T copy-mode-vi M-b send -X cancel
bind -T copy-mode-vi M-h ''
bind -T copy-mode-vi M-j ''
bind -T copy-mode-vi M-k ''
bind -T copy-mode-vi M-l ''
bind -T copy-mode-vi M-s ''
bind -T copy-mode-vi M-v ''
