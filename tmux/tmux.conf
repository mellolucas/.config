# Panes where Ghostty is absent (GitHub Codespaces, WSL, SSH, other
# terminals): tmux's own keys behind its prefix, Ctrl+B, since Command never
# reaches tmux. The mouse focuses, resizes, scrolls, and selects.

# Neovim: no Esc delay (tmux before 3.5 waits 500 ms), focus events, truecolor
set -s escape-time 10
set -g focus-events on
set -g default-terminal tmux-256color
set -as terminal-features ',xterm*:RGB'

# Agents wrap their notifications (OSC 9 and 777) for tmux to pass to the
# terminal, which shows them; from panes in sight only, as all would let
# programs out of sight set the clipboard (OSC 52) or have the terminal type
# replies into the focused pane
set -g allow-passthrough on

set -g mouse on
set -g history-limit 50000

# Splits open in the pane's directory, as Ghostty's do; in a workspace's
# window, with its editor's socket, which the window keeps
# (zsh/functions/workspace). -e takes no format, so run-shell -C expands the
# command first, leaving ## to split-window, which expands -c itself
bind '"' run-shell -C "split-window -v -c '##{pane_current_path}' -e DOTFILES_EDITOR_SOCKET=#{q:@dotfiles_editor_socket}"
bind % run-shell -C "split-window -h -c '##{pane_current_path}' -e DOTFILES_EDITOR_SOCKET=#{q:@dotfiles_editor_socket}"

# Only a workspace's own panes get its editor's socket, and its editor's pane
# the flag to serve it (zsh/functions/workspace): never every pane, from the
# environment of the shell that starts the server (a workspace's pane, say)
setenv -gu DOTFILES_EDITOR_SOCKET
setenv -gu DOTFILES_EDITOR_SERVE

# Terminal palette colors, so tmux follows Catppuccin Mocha and Latte
set -g status-style default
set -g pane-active-border-style fg=blue
set -g mode-style reverse
set -g message-style reverse
