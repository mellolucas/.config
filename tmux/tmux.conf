# Panes where Ghostty is absent (GitHub Codespaces, WSL, SSH, other
# terminals): tmux's own keys behind its prefix, Ctrl+B, since Command never
# reaches tmux. The mouse focuses, resizes, scrolls, and selects.

# Neovim: no Esc delay (tmux before 3.5 waits 500 ms), focus events, truecolor
set -s escape-time 10
set -g focus-events on
set -g default-terminal tmux-256color
set -as terminal-features ',xterm*:RGB'

# Agents wrap their notifications (OSC 9 and 777) for tmux to pass to the
# terminal, which shows them; all passes them from panes out of sight too
set -g allow-passthrough all

set -g mouse on
set -g history-limit 50000

# Splits open in the pane's directory, as Ghostty's do
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'

# Terminal palette colors, so tmux follows Catppuccin Mocha and Latte
set -g status-style default
set -g pane-active-border-style fg=blue
set -g mode-style reverse
set -g message-style reverse
